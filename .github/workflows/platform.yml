name: platform

on:
  push:
    branches: [main]
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'
      - 'models/point_queue/wp2_9/tests/golden/**'
      - 'docs/CROSS_MODEL_RECONCILIATION.md'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/platform.yml'

jobs:
  typecheck-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and determinism tests
        run: npm test
      - name: Production build
        run: npm run build
